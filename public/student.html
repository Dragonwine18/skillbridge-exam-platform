<!DOCTYPE html>
<html>

<head>
    <title>Take Exam</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Take Examination</h1>

    <div id="examLoading">Loading your selected assessment...</div>

    <div id="candidateIdentity" class="candidate-identity" style="display:none;">
        <span class="candidate-label">Candidate</span>
        <strong id="studentNameDisplay">Loading...</strong>
    </div>

    <button onclick="startExam()">
        Start Assessment
    </button>

    <div id="examArea"></div>

    <video
        id="camera"
        autoplay
        muted
    ></video>

</div>


<script>

let exam = null;
let stream = null;
let recorder = null;
let chunks = [];
let examActive = false;
let answers = {};
let recorderStopHandler = null;
let submissionInProgress = false;


// ===============================
// START EXAM
// ===============================

async function startExam() {

    const examId = new URLSearchParams(window.location.search).get("exam");

    if (!examId) {
        alert("Please select an assessment from Available Exams.");
        window.location.href = "/student-portal.html";
        return;
    }

    // The candidate name is taken automatically from the logged-in student profile.
    const profileResponse = await fetch("/api/student/profile");
    const profilePayload = await profileResponse.json().catch(() => ({}));
    if (!profileResponse.ok || !profilePayload.success || !profilePayload.profile?.full_name) {
        alert(profilePayload.error || "We could not load your student account. Please return to the Student Portal.");
        window.location.href = "/student-portal.html";
        return;
    }
    const name = profilePayload.profile.full_name;

    document.getElementById("studentNameDisplay").textContent = name;
    document.getElementById("candidateIdentity").style.display = "flex";

    // Get the selected exam from the server.
    const response =
        await fetch(`/api/exams/${encodeURIComponent(examId)}`);

    const payload = await response.json().catch(() => ({}));

    if (response.status === 429 && payload.code === "COOLDOWN_30_DAYS") {
        const nextDate = payload.nextAvailableAt
            ? new Date(payload.nextAvailableAt).toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" })
            : "30 days after your last attempt";
        alert(`30-day cooldown reached. You can take this exam again from ${nextDate}.`);
        window.location.href = "/student-portal.html";
        return;
    }

    if (!response.ok) {
        alert(payload.error || "Exam not found.");
        return;
    }

    exam = payload;
    document.getElementById("examLoading").style.display = "none";


    // Ask for camera and microphone

    try {

        stream =
            await navigator.mediaDevices.getUserMedia({

                video: true,
                audio: true

            });


        document.getElementById("camera")
            .srcObject = stream;

    }

    catch (error) {

        alert(
            "Camera and microphone permission are required."
        );

        return;
    }


    // Start recording

    chunks = [];

    recorder =
        new MediaRecorder(stream);


    recorder.ondataavailable = function(event) {

        if (event.data.size > 0) {

            chunks.push(event.data);

        }

    };


    recorder.onstop = async function() {
        // Submission/termination installs its own promise handler before
        // stopping the recorder. This fallback keeps the recording safe if
        // the recorder is stopped for another reason.
        if (recorderStopHandler) {
            const handler = recorderStopHandler;
            recorderStopHandler = null;
            await handler();
        }
    };


    recorder.start();


    examActive = true;

    displayExam();

}


// ===============================
// DISPLAY EXAM
// ===============================

function getOption(q, letter) {
    if (!q || !q.options) return "";
    if (Array.isArray(q.options)) {
        return q.options[{ A: 0, B: 1, C: 2, D: 3 }[letter]] || "";
    }
    return q.options[letter] || "";
}

function displayExam() {

    const area =
        document.getElementById("examArea");


    area.innerHTML = `

        <h2>${exam.title}</h2>

        <p>
            Duration: ${exam.duration} minutes
        </p>

        <div id="questions"></div>

        <button onclick="submitExam()">
            Submit Exam
        </button>

    `;


    const questions =
        document.getElementById("questions");


    exam.questions.forEach(function(q, index) {

        questions.innerHTML += `

            <div class="examQuestion">

                <h3>
                    ${index + 1}. ${q.question}
                </h3>

                <label>
                    <input
                        type="radio"
                        name="q${index}"
                        onchange="saveAnswer(${index}, 'A')"
                    >
                    ${getOption(q, 'A')}
                </label>

                <label>
                    <input
                        type="radio"
                        name="q${index}"
                        onchange="saveAnswer(${index}, 'B')"
                    >
                    ${getOption(q, 'B')}
                </label>

                <label>
                    <input
                        type="radio"
                        name="q${index}"
                        onchange="saveAnswer(${index}, 'C')"
                    >
                    ${getOption(q, 'C')}
                </label>

                <label>
                    <input
                        type="radio"
                        name="q${index}"
                        onchange="saveAnswer(${index}, 'D')"
                    >
                    ${getOption(q, 'D')}
                </label>

            </div>

        `;

    });

}


// ===============================
// SAVE ANSWER
// ===============================

function saveAnswer(questionIndex, answer) {
    const question = exam?.questions?.[questionIndex];
    if (!question) return;
    const questionId = question.id || `q-${questionIndex + 1}`;
    answers[questionId] = answer;
}


// ===============================
// DETECT TAB OR WINDOW SWITCH
// ===============================

document.addEventListener(
    "visibilitychange",
    function() {

        if (
            document.hidden &&
            examActive
        ) {

            terminateExam("tab_or_window_switch");

        }

    }
);


// Detect browser window losing focus

window.addEventListener(
    "blur",
    function() {

        if (examActive) {

            terminateExam("tab_or_window_switch");

        }

    }
);


// ===============================
// TERMINATE EXAM
// ===============================

async function terminateExam(reason) {

    if (!examActive) {
        return;
    }


    examActive = false;


    document.getElementById("examArea")
        .innerHTML = `

            <h1>Exam Terminated</h1>

            <p>
                The exam was terminated because
                you left the exam tab.
            </p>

        `;


    if (recorder && recorder.state !== "inactive") {
        await stopRecordingAndSubmit("terminated", reason);
    }

}


// ===============================
// SUBMIT EXAM
// ===============================

async function submitExam() {

    if (!examActive) {
        return;
    }


    examActive = false;


    document.getElementById("examArea")
        .innerHTML = `

            <h1>Exam Submitted</h1>

            <p>
                Your exam is being saved...
            </p>

        `;


    if (recorder && recorder.state !== "inactive") {
        await stopRecordingAndSubmit("completed", "");
    } else {
        await finishAttemptWithoutRecording("completed", "");
    }
}


// ===============================
// STOP RECORDER SAFELY THEN SEND
// ===============================

function stopRecordingAndSubmit(status, reason) {
    return new Promise(function(resolve) {
        recorderStopHandler = async function() {
            try {
                const videoBlob = new Blob(chunks, { type: "video/webm" });
                await sendAttempt(videoBlob, status, reason);
            } finally {
                resolve();
            }
        };

        try {
            recorder.stop();
        } catch (error) {
            recorderStopHandler = null;
            resolve();
        }
    });
}

async function finishAttemptWithoutRecording(status, reason) {
    await sendAttempt(null, status, reason);
}


// ===============================
// SEND TO SERVER
// ===============================

async function sendAttempt(
    videoBlob,
    status,
    reason
) {

    const form =
        new FormData();


    if (videoBlob && videoBlob.size > 0) {
        form.append("video", videoBlob, "recording.webm");
    }


    form.append(
        "examId",
        exam.id
    );


    // Name is resolved server-side from the authenticated student account.

    form.append(
        "answers",
        JSON.stringify(answers)
    );

    form.append(
        "questionIds",
        JSON.stringify(exam.questions.map(q => q.id))
    );


    form.append(
        "status",
        status
    );


    form.append(
        "reason",
        reason || ""
    );


    const response =
        await fetch(
            "/api/attempts",
            {
                method: "POST",
                body: form
            }
        );


    const result =
        await response.json();


    if (!response.ok || !result.success) {
        throw new Error(result.error || "Could not save the exam.");
    }

    console.log("Attempt saved:", result.attemptId);

    // Stop camera and microphone

    if (stream) {
        stream.getTracks().forEach(track => track.stop());
    }

    if (status === "completed" && result.attemptId) {
        window.location.href = `/result.html?attempt=${encodeURIComponent(result.attemptId)}`;
    } else if (status === "terminated") {
        window.location.href = "/student-portal.html";
    }

}

</script>

</body>

</html>
